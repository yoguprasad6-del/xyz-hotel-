<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hotel-showcase-demo</title>
    <style>
      /* Preloader styles (inline so it shows before app CSS loads) */
      #preloader{
        position:fixed;
        inset:0;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        z-index:9999;
        flex-direction:column;
      }
      .preloader-logo{
        width:84px;
        height:84px;
        margin-bottom:18px;
      }
      .dots{
        display:flex;
        gap:12px;
        align-items:center;
        justify-content:center;
      }
      .dot{
        width:14px;
        height:14px;
        border-radius:50%;
        transform:scale(1);
        animation: bounce 1s infinite ease-in-out;
      }
      .dot:nth-child(1){ background:#ef4444; animation-delay:0s; }
      .dot:nth-child(2){ background:#3b82f6; animation-delay:0.12s; }
      .dot:nth-child(3){ background:#10b981; animation-delay:0.24s; }
      .dot:nth-child(4){ background:#8b5cf6; animation-delay:0.36s; }

      @keyframes bounce{
        0%,100%{ transform:translateY(0) scale(1); opacity:1 }
        50%{ transform:translateY(-10px) scale(1.15); opacity:0.9 }
      }

      /* fade-out helper when app is ready */
      #preloader.fade-out{ opacity:0; transition:opacity .45s ease; pointer-events:none }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <img class="preloader-logo" src="/src/assets/react.svg" alt="logo">
      <div class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
